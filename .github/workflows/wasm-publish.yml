name: WASM Publish

on:
  workflow_dispatch:
  release:
    types: [published]

# id-token: write is required for npm trusted publishing (OIDC);
# no NPM_TOKEN secret is needed.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish @parsanol/wasm to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      # Trusted publishing requires npm >= 11.5.1 (OIDC support).
      # Node 24 bundles npm 11; Node 22 bundles npm 10, which cannot
      # authenticate via OIDC.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # wasm-pack requires a cdylib, but the crate stays rlib-only in
      # the tree: the ruby side's cdylib twin crate (ext/parsanol_cdylib)
      # owns the libparsanol.* artifact naming, and a permanent cdylib on
      # the main crate would shadow it in shared target dirs. Enable it
      # just-in-time for this build only.
      - name: Enable cdylib for wasm-pack
        run: |
          sed -i 's/^crate-type = \["rlib"\]/crate-type = ["rlib", "cdylib"]/' parsanol/Cargo.toml
          grep -q cdylib parsanol/Cargo.toml || { echo "could not patch crate-type in parsanol/Cargo.toml"; exit 1; }

      # Generated npm payload lives OUTSIDE the crate dir so it can never
      # leak into a `cargo publish` tarball; /wasm/ is gitignored.
      - name: Build wasm-pack
        run: wasm-pack build parsanol --target web --scope parsanol --out-dir ../wasm --release --features wasm

      - name: Prepare npm package
        run: |
          cd wasm
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '@parsanol/wasm';
            pkg.description = 'Parsanol PEG parser — WebAssembly bindings';
            pkg.repository = { type: 'git', url: 'https://github.com/parsanol/parsanol-rs' };
            pkg.keywords = ['parser', 'peg', 'wasm', 'rust'];
            pkg.license = 'MIT';
            pkg.files = ['parsanol_bg.wasm', 'parsanol_bg.wasm.d.ts', 'parsanol.js', 'parsanol.d.ts'];
            delete pkg.main;
            pkg.module = 'parsanol.js';
            pkg.types = 'parsanol.d.ts';
            pkg.exports = { '.': { types: './parsanol.d.ts', default: './parsanol.js' } };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Publish to npm
        run: cd wasm && npm publish --access public
