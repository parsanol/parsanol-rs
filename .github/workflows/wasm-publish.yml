name: WASM Publish

on:
  workflow_dispatch:
  release:
    types: [published]

# id-token: write is required for npm trusted publishing (OIDC);
# no NPM_TOKEN secret is needed.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish @parsanol/wasm to npm
    runs-on: ubuntu-latest
    # Every release tag fires this workflow (the workspace releases
    # parsanol and parsanol-derive together), but @parsanol/wasm is
    # versioned by the workspace — the second tag's publish hits the
    # first's staged version and fails with npm 409 (seen on v0.17.2).
    # Only the main crate's tag publishes.
    if: startsWith(github.event.release.tag_name, 'parsanol-v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # The published glue must come from wasm-bindgen CLI 0.2.130 —
      # the exact version parsanol-ts's candidate recipe pins (the ts
      # vendor receipts record it; other glue versions fail the ts
      # typed-resource browser suite, seen against the 0.20.13
      # artifact). wasm-pack bundles its own, older wasm-bindgen and
      # additionally runs wasm-opt — neither matches the contract.
      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130

      # Trusted publishing requires npm >= 11.5.1 (OIDC support).
      # Node 24 bundles npm 11; Node 22 bundles npm 10, which cannot
      # authenticate via OIDC.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # The typed call-depth contract (CallDepthLimitExceeded at the
      # engine's 1024-atom resource limit) needs stack headroom: the
      # default 1MiB wasm stack traps out-of-bounds on deep recursion
      # before the limit fires — and even the free() of a deep parse's
      # tree overflows it. Seen when parsanol-ts's browser depth suite
      # ran against the 0.20.13 artifact (ts#62). 8MiB is the
      # candidate-build profile the ts vendor receipts pin
      # (wasm_stack_bytes). RUSTFLAGS, not -- flags: those would go to
      # `cargo build`, not rustc. The crate ships cdylib crate-type
      # (027c358) so the wasm artifact links directly.
      - name: Build wasm core
        env:
          RUSTFLAGS: -C link-arg=-zstack-size=8388608
        run: cargo build --release --target wasm32-unknown-unknown -p parsanol --features wasm

      # Generated npm payload lives OUTSIDE the crate dir so it can never
      # leak into a `cargo publish` tarball; /wasm/ is gitignored.
      - name: Bindgen (web)
        run: |
          rm -rf wasm
          wasm-bindgen target/wasm32-unknown-unknown/release/parsanol.wasm --target web --out-dir wasm

      # wasm-bindgen emits no package.json (wasm-pack used to) — the
      # package is written from scratch, versioned from the workspace
      # crate so the npm release matches the cargo tag that fired this
      # workflow.
      - name: Prepare npm package
        run: |
          cd wasm
          node -e "
            const fs = require('fs');
            const cargo = fs.readFileSync('../Cargo.toml', 'utf8');
            const version = cargo.match(/^version\s*=\s*\"([^\"]+)\"/m)[1];
            if (!version) { throw new Error('could not read the workspace version from ../Cargo.toml'); }
            const pkg = {
              name: '@parsanol/wasm',
              version,
              description: 'Parsanol PEG parser — WebAssembly bindings',
              repository: { type: 'git', url: 'https://github.com/parsanol/parsanol-rs' },
              keywords: ['parser', 'peg', 'wasm', 'rust'],
              license: 'MIT',
              type: 'module',
              files: ['parsanol_bg.wasm', 'parsanol_bg.wasm.d.ts', 'parsanol.js', 'parsanol.d.ts', 'README.md'],
              module: 'parsanol.js',
              types: 'parsanol.d.ts',
              exports: {
                '.': { types: './parsanol.d.ts', default: './parsanol.js' },
                './package.json': './package.json',
              },
            };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
            // rs#308: the init surface is the DEFAULT export (async) and
            // initSync; Node has no fetch for package paths, so the
            // documented pattern is initSync with pre-read bytes. The
            // pointer goes at the top of the d.ts and in a README (the
            // package shipped neither).
            const dts = fs.readFileSync('parsanol.d.ts', 'utf8');
            fs.writeFileSync('parsanol.d.ts', [
              '// Node usage: the default init fetches the wasm next to the module,',
              '// which Node does not serve; use initSync with pre-read bytes:',
              '//   import { initSync } from "./parsanol.js";',
              '//   import { readFileSync } from "node:fs";',
              '//   initSync({ module: readFileSync("./parsanol_bg.wasm") });',
              '// The async bootstrap is the DEFAULT export (__wbg_init): Promise<InitOutput>.',
              '// parseAndBind returns {} when the entry declares no bindings block.',
              dts,
            ].join('\n'));
          "
          # The README ships as a committed template (rs#308's Node
          # pattern) — copied in, backtick-safe outside node -e. The
          # cwd is wasm/ (the step cd'd there for the node block).
          cp ../tools/wasm-README.md README.md

      - name: Publish to npm
        run: cd wasm && npm publish --access public
