# WASM Integration Tests
#
# This workflow runs WASM-specific tests that require wasm32 target.

name: WASM

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**.rs"
      - "parsanol/tests/wasm/**"
      - "tools/*wasm*"
      - "Cargo.toml"
      - ".github/workflows/wasm.yml"
  push:
    branches: [main]
    paths:
      - '**.rs'
      - 'parsanol/tests/wasm/**'
      - 'tools/*wasm*'
      - 'Cargo.toml'
      - '.github/workflows/wasm.yml'

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wasm:
    name: WASM Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build with WASM feature
        run: cargo rustc -p parsanol --release --no-default-features --features wasm --lib --target wasm32-unknown-unknown -- -C link-arg=-zstack-size=8388608

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Pack runtime and exercise Node and real browser
        shell: bash
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bindgen=$(python3 tools/fetch-wasm-bindgen.py --lockfile Cargo.lock --output "$RUNNER_TEMP/wasm-bindgen")
          "$bindgen" target/wasm32-unknown-unknown/release/parsanol.wasm --target web --out-dir "$RUNNER_TEMP/parsanol-web"
          python3 tools/package-wasm-ci.py --web-dir "$RUNNER_TEMP/parsanol-web" --output-dir "$RUNNER_TEMP/parsanol-wasm-runtime" --source-head "$SOURCE_HEAD_SHA" --bindgen "$bindgen"
          mkdir -p "$RUNNER_TEMP/wasm-compatibility-evidence"
          node tools/check-wasm-node.mjs "$RUNNER_TEMP/parsanol-wasm-runtime/package" | tee "$RUNNER_TEMP/wasm-compatibility-evidence/node.json"
          python3 tools/check-wasm-compatibility.py --web-dir "$RUNNER_TEMP/parsanol-wasm-runtime/package" --evidence-dir "$RUNNER_TEMP/wasm-compatibility-evidence"

      - name: Upload browser compatibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-compatibility-evidence
          path: ${{ runner.temp }}/wasm-compatibility-evidence
          if-no-files-found: ignore

      - name: Run clippy with WASM
        run: cargo clippy --no-default-features --features wasm -- -D warnings

      - name: Run WASM library tests (native)
        run: cargo test --no-default-features --features wasm --lib

      - name: Run artifact and C ABI compatibility tests
        run: cargo test -p parsanol --no-default-features --test parg_compatibility

      - name: Upload tested WASM runtime
        uses: actions/upload-artifact@v7
        with:
          name: parsanol-wasm-runtime
          path: ${{ runner.temp }}/parsanol-wasm-runtime
          if-no-files-found: error
