name: Flavor request
description: "A data or identifier grammar you want in the registry (the gate stack included)"
labels: ["flavor", "grammar"]
body:
  - type: input
    id: format
    attributes:
      label: Format / identifier scheme
      description: "The spec (RFC, ISO, vendor doc) and a pointer to real-world corpora"
    validations:
      required: true
  - type: textarea
    id: corpus
    attributes:
      label: Corpus availability
      description: "Where real-world samples live — flavors ship with a corpus and the full gate stack"
    validations:
      required: true
