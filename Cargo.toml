[workspace]
resolver = "2"
members = [
    "parsanol-ffi",
    "parsanol",
    "parsanol-derive",
]

[workspace.package]
version = "0.18.8"
edition = "2021"
authors = ["Ribose Inc. <open.source@ribose.com>"]
license = "MIT"
repository = "https://github.com/parsanol/parsanol-rs"

[workspace.dependencies]
# Shared dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 0.11.1 raised its MSRV to rustc 1.88, past the workspace's 1.86
# CI leg; the lockfile is not committed, so that leg re-resolves to
# the newest 0.11.x on every run (the proptest =1.10.0 precedent).
sha2 = "=0.11.1"
regex = "1.10"
regex-syntax = "0.8"
hashbrown = "0.17"
ahash = "0.8"
memchr = "2.7"
syn = { version = "3.0", features = ["full", "parsing", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.release.package."*"]
opt-level = "s"

